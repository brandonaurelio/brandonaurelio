name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pikachu-palette snake
        uses: Platane/snk@v3
        with:
          github_user_name: brandonaurelio
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFCB05&color_dots=%23FFF9DB,%23FFE066,%23FFD43B,%23FCC419,%23F59F00&color_background=%232C2C2C

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
